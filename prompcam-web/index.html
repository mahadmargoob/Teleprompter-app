<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PromptCam">
<meta name="theme-color" content="#0A0B0D">
<meta name="description" content="A free teleprompter that records you while you read. Works offline.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<link rel="manifest" href="manifest.json">
<title>PromptCam</title>
<style>
  :root, [data-theme="midnight"]{
    --bg:#0A0B0D; --panel:#15171B; --panel-2:#1D2025; --line:#2A2E35;
    --text:#EDEEF0; --dim:#9AA0AA;
    --accent:#E5484D; --accent-rgb:229,72,77;
    --accent-2:#3B8CE0; --accent-2-rgb:59,140,224; --on-accent:#fff;
    --radius:14px;
  }
  [data-theme="light"]{
    --bg:#F4F5F7; --panel:#FFFFFF; --panel-2:#ECEEF2; --line:#D9DDE4;
    --text:#15171B; --dim:#5B6472;
    --accent:#CE2C3F; --accent-rgb:206,44,63;
    --accent-2:#2563D9; --accent-2-rgb:37,99,217;
  }
  [data-theme="crimson"]{
    --bg:#0D0708; --panel:#1A1112; --panel-2:#231617; --line:#3A1F21;
    --text:#F5EDEE; --dim:#BC9497;
    --accent:#FF5A5A; --accent-rgb:255,90,90;
    --accent-2:#E8703A; --accent-2-rgb:232,112,58;
  }
  [data-theme="ocean"]{
    --bg:#061219; --panel:#0E1F2B; --panel-2:#13293A; --line:#1E3B4F;
    --text:#E8F3F8; --dim:#86AABC;
    --accent:#FF6B6B; --accent-rgb:255,107,107;
    --accent-2:#1FA890; --accent-2-rgb:31,168,144;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%; margin:0; overflow:hidden; overscroll-behavior:none;}
  body{
    position:fixed; inset:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
    -webkit-text-size-adjust:100%; line-height:1.4;
  }
  button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
  input,textarea,select{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent-2); outline-offset:2px;}
  input[type=range]{accent-color:var(--accent-2); touch-action:manipulation;}

  .view{
    display:none; position:absolute; top:0; left:0; right:0;
    height:var(--app-h, 100dvh); overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .view.active{display:block;}
  .view.fullscreen{
    overflow:hidden; padding:0; background:#000; color:#fff;
    /* Camera screens keep one dark palette whatever theme is chosen, so text
       and controls stay readable over video. */
    --text:#fff; --dim:#C5CAD3; --panel:#1B1E24; --panel-2:#262A32; --line:#3D434E;
    --accent:#FF5A5F; --accent-rgb:255,90,95; --accent-2:#4C9BEF; --accent-2-rgb:76,155,239;
  }
  .view.fullscreen.active{display:flex; flex-direction:column;}
  .page{max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  .row{display:flex; gap:10px; align-items:center;}
  .row.between{justify-content:space-between;}
  .row.end{justify-content:flex-end;}
  .spacer{flex:1;}
  .hint{color:var(--dim); font-size:13px; line-height:1.5; margin:8px 0 0;}

  /* ---------- Buttons ---------- */
  .btn{
    border:1px solid transparent; border-radius:12px; padding:12px 18px; min-height:46px;
    font-size:16px; font-weight:600; color:var(--on-accent); background:var(--accent-2);
  }
  .btn.small{padding:8px 14px; min-height:40px; font-size:14px;}
  .btn.secondary{background:var(--panel-2); color:var(--text); border-color:var(--line);}
  .btn.danger{background:transparent; color:var(--accent); border-color:rgba(var(--accent-rgb),.5);}
  .btn.dangerSolid{background:var(--accent); color:#fff;}
  .btn:disabled{opacity:.45;}
  .iconbtn{
    width:44px; height:44px; border-radius:12px; background:var(--panel); border:1px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; padding:0;
  }

  /* ---------- Library ---------- */
  header.bar{display:flex; align-items:center; justify-content:space-between; padding:16px 16px 8px;}
  header.bar h1{font-size:24px; font-weight:700; margin:0; letter-spacing:-0.01em;}
  .tabs{display:flex; gap:4px; margin:6px 16px 10px; padding:4px; background:var(--panel-2); border-radius:12px;}
  .tabs button{flex:1; min-height:40px; border:none; border-radius:9px; background:transparent; color:var(--dim); font-size:14px; font-weight:600;}
  .tabs button.on{background:var(--panel); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.25);}
  #searchBox{
    display:block; width:calc(100% - 32px); margin:0 16px 10px; padding:11px 14px; min-height:44px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; font-size:16px;
  }
  #scriptList,#takeList{padding:0 16px 110px;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:10px; display:flex; align-items:center; gap:10px; padding:6px 12px 6px 4px;
  }
  .cardMain{flex:1; min-width:0; text-align:left; background:none; border:none; padding:10px 12px; border-radius:10px;}
  .cardMain h3{margin:0 0 3px; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .cardMain p{margin:0; font-size:13px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .emptyState{color:var(--dim); text-align:center; padding:70px 30px; font-size:15px; line-height:1.6;}
  .notice{margin:0 16px 12px; padding:14px 16px; border-radius:var(--radius); background:rgba(var(--accent-rgb),.12); border:1px solid rgba(var(--accent-rgb),.4);}
  .notice p{margin:0 0 10px; font-size:13px; line-height:1.5;}
  #takesInfo{margin:0 16px 12px;}
  .fab{
    position:fixed; right:max(20px, calc(50vw - 340px)); bottom:calc(24px + env(safe-area-inset-bottom));
    width:60px; height:60px; border-radius:50%; background:var(--accent-2); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; box-shadow:0 6px 18px rgba(var(--accent-2-rgb),.45); z-index:6;
  }

  /* ---------- Editor ---------- */
  .editorWrap{padding:12px 16px 14px; height:100%; min-height:0;}
  #scriptTitle{background:transparent; border:none; font-size:22px; font-weight:700; padding:12px 4px 8px; outline:none; width:100%;}
  #scriptBody{
    flex:1; min-height:120px; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    font-size:18px; line-height:1.55; padding:16px; outline:none; resize:none;
  }
  #scriptBody:focus{border-color:var(--accent-2);}
  .editorTools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding-top:10px;}
  #wordCount{color:var(--dim); font-size:13px;}
  .editorFooter{display:flex; justify-content:space-between; gap:8px; padding-top:10px;}

  /* ---------- Settings & shared controls ---------- */
  .groupTitle{padding:22px 16px 2px; margin:0; font-size:13px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);}
  .field{padding:13px 16px; border-bottom:1px solid var(--line);}
  .field label,.fieldLabel{display:flex; justify-content:space-between; gap:12px; font-size:14px; color:var(--dim); margin-bottom:8px;}
  .field output{color:var(--text); font-variant-numeric:tabular-nums;}
  .field input[type=range]{width:100%; height:32px; margin:0;}
  .field select{width:100%; min-height:44px; padding:8px 12px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; font-size:16px;}
  .segment{display:flex; flex-wrap:wrap; background:var(--panel-2); border-radius:11px; padding:3px; gap:3px;}
  .segment button{flex:1 1 auto; min-height:40px; padding:8px 10px; border:none; border-radius:8px; background:transparent; color:var(--dim); font-size:13px; font-weight:600;}
  .segment button.on{background:var(--accent-2); color:var(--on-accent);}
  .toggleRow{display:flex; justify-content:space-between; align-items:center; gap:14px; font-size:15px;}
  .switch{flex-shrink:0; width:52px; height:32px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line); position:relative; padding:0;}
  .switch .knob{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--dim); transition:left .15s, background .15s;}
  .switch.on{background:rgba(var(--accent-2-rgb),.4); border-color:var(--accent-2);}
  .switch.on .knob{left:23px; background:var(--accent-2);}
  .settingsPad{padding:14px 16px;}

  /* ---------- Prompter ---------- */
  #view-prompter{position:absolute; -webkit-user-select:none; user-select:none;}
  #camera{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:#000;}
  #camera.mirrored{transform:scaleX(-1);}
  #promptWindow{
    position:absolute; left:0; right:0; overflow:hidden; z-index:2; touch-action:none; cursor:grab;
    border-radius:0 0 16px 16px;
  }
  #promptInner{
    position:absolute; inset:0; overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 9%, #000 86%, transparent 100%);
            mask-image:linear-gradient(to bottom, transparent 0, #000 9%, #000 86%, transparent 100%);
  }
  #promptInner.mirror{transform:scaleX(-1);}
  #promptText{
    position:absolute; top:0; left:0; right:0; max-width:920px; margin:0 auto; font-weight:600; line-height:1.36; color:#fff;
    white-space:pre-wrap; overflow-wrap:break-word; will-change:transform; text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .dimOn .w.read{opacity:.4;}
  .pauseMark{font-size:.5em; vertical-align:middle; padding:.15em .6em; border-radius:1em; background:rgba(255,255,255,.18); color:#fff; font-weight:600; white-space:nowrap;}
  .pauseMark.holding{background:var(--accent-2);}
  /* A soft band behind the line being read, with a marker at each edge. */
  #guideLine{
    position:absolute; left:0; right:0; transform:translateY(-50%); pointer-events:none;
    background:rgba(255,255,255,.10); border-left:4px solid var(--accent-2); border-right:4px solid var(--accent-2);
  }

  .topBar{
    position:absolute; top:0; left:0; right:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));
    background:linear-gradient(to bottom, rgba(0,0,0,.6), rgba(0,0,0,.25));
  }
  .roundBtn{
    width:46px; height:46px; flex-shrink:0; border-radius:50%; background:rgba(255,255,255,.16); color:#fff; border:none; padding:0;
    display:inline-flex; align-items:center; justify-content:center; font-size:15px; font-weight:700;
  }
  .roundBtn.active{background:rgba(var(--accent-2-rgb),.8);}
  .roundBtn:disabled{opacity:.35;}
  .statusWrap{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:5px;}
  #statusPill{display:flex; align-items:center; gap:7px; max-width:100%; font-variant-numeric:tabular-nums; font-size:14px; font-weight:600; background:rgba(0,0,0,.6); padding:5px 12px; border-radius:20px; white-space:nowrap;}
  .recDot{width:10px; height:10px; border-radius:50%; background:var(--accent); animation:pulse 1.1s infinite;}
  #statusPill.paused .recDot{animation:none; opacity:.4;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}
  #micMeter{width:64px; height:4px; border-radius:2px; background:rgba(255,255,255,.22); overflow:hidden;}
  #micFill{display:block; height:100%; width:100%; background:#4ADE80; transform-origin:left; transform:scaleX(0);}

  .bottomBar{
    position:absolute; left:0; right:0; bottom:0; z-index:5; display:flex; flex-direction:column; gap:10px;
    padding:26px calc(16px + env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
    background:linear-gradient(to top, rgba(0,0,0,.8) 55%, transparent);
  }
  .progress{height:4px; border-radius:2px; background:rgba(255,255,255,.22); overflow:hidden;}
  #progFill{display:block; height:100%; width:100%; background:var(--accent-2); transform-origin:left; transform:scaleX(0);}
  .progMeta{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums;}
  #modePill{background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:20px; padding:6px 12px; min-height:32px; font-size:12px; font-weight:700;}
  #speedRow{display:flex; align-items:center; gap:10px;}
  #speedRow input{flex:1; min-width:0; height:32px;}
  #speedRow.noSlider input,#speedRow.noSlider .stepBtn{display:none;}
  #speedRow.noSlider{justify-content:center;}
  .stepBtn{width:38px; height:38px; flex-shrink:0; border-radius:50%; border:none; background:rgba(255,255,255,.16); color:#fff; font-size:20px; font-weight:700; padding:0;}
  #speedLabel{min-width:78px; text-align:right; font-size:13px; font-weight:600; font-variant-numeric:tabular-nums;}
  #speedRow.noSlider #speedLabel{text-align:center;}
  .ctrlRow{display:flex; align-items:flex-start; justify-content:space-between; max-width:420px; width:100%; margin:0 auto;}
  .ctl{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:58px; font-size:11px; font-weight:600; color:var(--dim);}
  .ctl .roundBtn{margin-top:14px;}
  #btnRecPause:not(:disabled){box-shadow:inset 0 0 0 2px var(--accent);}
  .recBtn{width:74px; height:74px; flex-shrink:0; border-radius:50%; border:4px solid #fff; background:transparent; position:relative; padding:0;}
  .recBtn::after{content:""; position:absolute; inset:7px; border-radius:50%; background:var(--accent); transition:inset .18s, border-radius .18s;}
  .recBtn.recording::after{inset:20px; border-radius:6px;}
  .recBtn.arming::after{animation:pulse .8s infinite;}
  .fade{transition:opacity .3s;}
  .dimmed .fade{opacity:.3;}

  #countdownOverlay{
    position:absolute; inset:0; z-index:9; background:rgba(0,0,0,.6); border:none; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  #countNum{font-size:130px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums;}
  #countdownOverlay small{font-size:15px; color:#C5CAD3;}
  #camError{
    position:absolute; left:16px; right:16px; top:50%; transform:translateY(-10%); z-index:6; max-width:440px; margin:0 auto;
    background:rgba(20,22,26,.94); border:1px solid var(--line); border-radius:16px; padding:18px;
  }
  #camError p{margin:0 0 14px; font-size:14px; line-height:1.5;}

  .sheet{
    position:absolute; left:0; right:0; bottom:0; z-index:8; max-height:50%; overflow-y:auto; -webkit-overflow-scrolling:touch;
    background:#14161A; border-radius:18px 18px 0 0; border-top:1px solid var(--line);
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  .sheetHead{position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:#14161A; border-bottom:1px solid var(--line);}
  .sheetHead h2{margin:0; font-size:17px;}

  /* ---------- Review ---------- */
  #view-review{overflow-y:auto;}
  .reviewTop{display:flex; align-items:center; gap:12px; flex-shrink:0; padding:calc(8px + env(safe-area-inset-top)) 12px 8px;}
  #reviewTitle{flex:1; min-width:0; margin:0; font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #reviewVideo{flex:1 1 0; min-height:30vh; width:100%; object-fit:contain; background:#000;}
  .reviewBar{flex-shrink:0; display:flex; flex-direction:column; gap:10px; max-width:560px; width:100%; margin:0 auto; padding:12px 16px calc(18px + env(safe-area-inset-bottom));}
  .reviewBar .row > .btn{flex:1;}
  #reviewNote{margin:0; font-size:13px; color:var(--dim); text-align:center;}

  /* ---------- Modal & toasts ---------- */
  .modal{position:fixed; inset:0; z-index:100; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:24px;}
  .modalCard{width:100%; max-width:380px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:18px; padding:20px;}
  .modalCard h2{margin:0 0 8px; font-size:18px;}
  .modalCard p{margin:0 0 16px; font-size:14px; line-height:1.5; color:var(--dim); white-space:pre-line;}
  #modalInput{width:100%; min-height:46px; padding:10px 12px; margin-bottom:16px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; font-size:16px;}
  #toasts{position:fixed; top:calc(12px + env(safe-area-inset-top)); left:12px; right:12px; z-index:110; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
  .toast{
    pointer-events:auto; max-width:460px; display:flex; align-items:center; gap:12px; padding:11px 15px; border-radius:12px;
    background:#23262D; color:#fff; border:1px solid #3D434E; font-size:14px; line-height:1.4; box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .toast.error{border-color:#FF5A5F;}
  .toast button{flex-shrink:0; background:#4C9BEF; color:#fff; border:none; border-radius:8px; padding:7px 12px; min-height:34px; font-size:13px; font-weight:700;}

  @media (orientation:landscape) and (max-height:520px){
    .bottomBar{
      display:grid; grid-template-columns:minmax(0,1fr) auto; grid-template-areas:"prog prog" "meta ctrl" "speed ctrl";
      column-gap:22px; row-gap:4px; padding-top:10px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    }
    .progress{grid-area:prog;} .progMeta{grid-area:meta;} #speedRow{grid-area:speed;}
    .ctrlRow{grid-area:ctrl; align-items:center; align-self:center; gap:12px; width:auto; max-width:none; margin:0;}
    .ctl{min-width:0;} .ctl span{display:none;} .ctl .roundBtn{margin-top:0;}
    .recBtn{width:58px; height:58px;}
    .recBtn.recording::after{inset:15px;}
    #countNum{font-size:90px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
  ::-webkit-scrollbar{display:none;}
</style>
</head>
<body data-view="library">

<!-- ===================== LIBRARY ===================== -->
<section id="view-library" class="view active"><div class="page">
  <header class="bar">
    <h1>PromptCam</h1>
    <div class="row">
      <button class="iconbtn" id="btnImport" data-icon="import" aria-label="Import a text file or backup"></button>
      <button class="iconbtn" id="btnSettings" data-icon="sliders" aria-label="Settings"></button>
    </div>
  </header>
  <div class="tabs" role="tablist">
    <button id="tabScripts" role="tab" class="on" aria-selected="true">Scripts</button>
    <button id="tabTakes" role="tab" aria-selected="false">Takes</button>
  </div>
  <div id="browserWarning" class="notice" hidden>
    <p></p>
    <button class="btn small secondary" id="btnDismissWarn">Got it</button>
  </div>
  <div id="panelScripts">
    <input id="searchBox" type="search" placeholder="Search scripts" aria-label="Search scripts" hidden>
    <div id="scriptList"></div>
  </div>
  <div id="panelTakes" hidden>
    <p id="takesInfo" class="hint"></p>
    <div id="takeList"></div>
  </div>
  <button class="fab" id="btnNew" data-icon="plus" aria-label="New script"></button>
  <input type="file" id="importFile" accept=".json,.txt,.md,application/json,text/plain" hidden>
</div></section>

<!-- ===================== EDITOR ===================== -->
<section id="view-editor" class="view"><div class="page editorWrap">
  <div class="row between">
    <button class="iconbtn" id="btnEditorBack" data-icon="back" aria-label="Back to scripts"></button>
    <button class="btn" id="btnUseScript">Start prompter</button>
  </div>
  <input id="scriptTitle" placeholder="Untitled script" aria-label="Script title" autocomplete="off">
  <textarea id="scriptBody" placeholder="Type or paste your script here…" aria-label="Script text"></textarea>
  <div class="editorTools">
    <button class="btn small secondary" id="btnInsertPause">+ Pause</button>
    <button class="btn small secondary" id="btnTarget">Target time: off</button>
    <span class="spacer"></span>
    <span id="wordCount">0 words</span>
  </div>
  <div class="editorFooter">
    <button class="btn small secondary" id="btnDuplicate">Duplicate</button>
    <button class="btn small danger" id="btnDeleteScript">Delete script</button>
  </div>
</div></section>

<!-- ===================== SETTINGS ===================== -->
<section id="view-settings" class="view"><div class="page">
  <header class="bar">
    <div class="row">
      <button class="iconbtn" id="btnSettingsBack" data-icon="back" aria-label="Back"></button>
      <h1>Settings</h1>
    </div>
  </header>
  <div id="settingsBody"></div>
  <h2 class="groupTitle">Backup</h2>
  <div class="settingsPad">
    <p class="hint" style="margin:0 0 12px;">Scripts are stored only on this device. Export them now and then so clearing browser data can't wipe your work.</p>
    <div class="row">
      <button class="btn secondary" style="flex:1;" id="btnExport">Export scripts</button>
      <button class="btn secondary" style="flex:1;" id="btnImportBackup">Import</button>
    </div>
  </div>
  <h2 class="groupTitle">About</h2>
  <div class="settingsPad">
    <p class="hint" id="aboutLine" style="margin:0 0 12px;"></p>
    <button class="btn small secondary" id="btnResetSettings">Reset settings to defaults</button>
  </div>
</div></section>

<!-- ===================== PROMPTER / CAMERA ===================== -->
<section id="view-prompter" class="view fullscreen">
  <video id="camera" autoplay playsinline muted></video>
  <div id="promptWindow">
    <div id="guideLine"></div>
    <div id="promptInner"><div id="promptText" dir="auto"></div></div>
  </div>

  <div id="camError" hidden>
    <p id="camErrorMsg"></p>
    <div class="row">
      <button class="btn small" id="btnCamRetry">Try again</button>
      <button class="btn small secondary" id="btnCamSkip">Rehearse without camera</button>
    </div>
  </div>

  <div class="topBar" id="topBar">
    <button class="roundBtn fade" id="btnExit" data-icon="close" aria-label="Close prompter"></button>
    <div class="statusWrap">
      <div id="statusPill" hidden><span class="recDot" id="recDot"></span><span id="statusText"></span></div>
      <div id="micMeter" class="fade" aria-hidden="true" hidden><span id="micFill"></span></div>
    </div>
    <div class="row" style="gap:8px;">
      <button class="roundBtn fade" id="btnTorch" data-icon="bolt" aria-label="Toggle torch" aria-pressed="false" hidden></button>
      <button class="roundBtn fade" id="btnFlip" data-icon="flip" aria-label="Switch camera"></button>
    </div>
  </div>

  <div class="bottomBar" id="bottomBar">
    <div class="progress" role="progressbar" aria-label="Script progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progBar"><span id="progFill"></span></div>
    <div class="progMeta fade">
      <button id="modePill" aria-label="Change pacing mode">Speed</button>
      <span id="timeLeft"></span>
    </div>
    <div id="speedRow" class="fade">
      <button class="stepBtn" id="btnSlower" aria-label="Slower">−</button>
      <input type="range" id="liveSpeed" min="60" max="300" step="5" aria-label="Reading speed in words per minute">
      <button class="stepBtn" id="btnFaster" aria-label="Faster">+</button>
      <span id="speedLabel"></span>
    </div>
    <div class="ctrlRow">
      <div class="ctl fade"><button class="roundBtn" id="btnRestart" data-icon="restart" aria-label="Back to the start of the script"></button><span aria-hidden="true">Restart</span></div>
      <div class="ctl fade"><button class="roundBtn" id="btnPlay" data-icon="play" aria-label="Start scrolling without recording"></button><span aria-hidden="true" id="capPlay">Rehearse</span></div>
      <div class="ctl"><button class="recBtn" id="btnRecord" aria-label="Start recording"></button><span aria-hidden="true" id="capRecord">Record</span></div>
      <div class="ctl fade"><button class="roundBtn" id="btnRecPause" data-icon="pause" aria-label="Pause recording" disabled></button><span aria-hidden="true" id="capRecPause">Hold rec</span></div>
      <div class="ctl fade"><button class="roundBtn" id="btnSheet" aria-label="Text and pacing settings">Aa</button><span aria-hidden="true">Text</span></div>
    </div>
  </div>

  <div id="quickSheet" class="sheet" hidden>
    <div class="sheetHead">
      <h2>Text and pacing</h2>
      <button class="btn small secondary" id="btnSheetClose">Done</button>
    </div>
    <div class="settingsPad" style="padding-bottom:0;">
      <button class="btn small secondary" id="btnSheetTarget">Target time: off</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <button id="countdownOverlay" hidden aria-label="Cancel countdown">
    <span id="countNum">3</span>
    <small>Tap to cancel</small>
  </button>
</section>

<!-- ===================== REVIEW ===================== -->
<section id="view-review" class="view fullscreen">
  <div class="reviewTop">
    <button class="roundBtn" id="btnReviewBack" data-icon="back" aria-label="Back to takes"></button>
    <h1 id="reviewTitle"></h1>
  </div>
  <video id="reviewVideo" controls playsinline></video>
  <div class="reviewBar">
    <p id="reviewNote"></p>
    <button class="btn" id="btnSavePhotos">Save to Photos</button>
    <div class="row">
      <button class="btn secondary" id="btnSaveFiles">Save to Files</button>
      <button class="btn secondary" id="btnCaptions">Captions (.srt)</button>
    </div>
    <div class="row">
      <button class="btn secondary" id="btnRetake">Retake</button>
      <button class="btn danger" id="btnDeleteTake">Delete</button>
    </div>
  </div>
</section>

<!-- ===================== MODAL & TOASTS ===================== -->
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modalCard">
    <h2 id="modalTitle"></h2>
    <p id="modalBody"></p>
    <input id="modalInput" hidden autocomplete="off" aria-label="Value">
    <div class="row end">
      <button class="btn small secondary" id="modalCancel">Cancel</button>
      <button class="btn small" id="modalOk">OK</button>
    </div>
  </div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
